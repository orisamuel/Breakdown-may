<style>

  button:active { transform: scale(0.97); }
  textarea, input, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 3px; }
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  .loader-dot { width: 10px; height: 10px; background: #7c3aed; border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }

  .loader-dot:nth-child(2) { animation-delay: -0.16s; }

  .loader-text { color: #475569; font-size: 13px; letter-spacing: 2px; }
  .loader-row { display: flex; gap: 8px; }
  .err { background: #1a0505; border: 1px solid #991b1b; color: #fca5a5; padding: 16px; margin: 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-family: monospace; }
</style>

function parseMinutes(slot) {
  if (!slot) return 9999;
  const first = slot.split("-")[0].trim().split("+")[0].trim();
  const parts = first.split(":").map(Number);
  return (parts[0] || 0) * 60 + (parts[1] || 0);
}

function addMinsToSlot(slot, delta) {
  if (!slot || slot.indexOf("+") !== -1) return slot;
  const parts = slot.split("-");
  const fmt = (total) => {
    const h = Math.floor(total / 60) % 24;
    const m = total % 60;
    return h + ":" + String(m).padStart(2, "0");
  };
  const parseT = (t) => {
    const p = t.trim().split(":").map(Number);
    return p[0] * 60 + (p[1] || 0);
  };
  if (parts.length === 2) return fmt(parseT(parts[0]) + delta) + "-" + fmt(parseT(parts[1]) + delta);
  return fmt(parseT(parts[0]) + delta);
}

function getStatus(statuses, id) {
  return (statuses[id] && statuses[id].status) || STATUS.PENDING;
}

function GlobalDelayModal({ onConfirm, onClose }) {
