    fetch(SYNC_URL,{method:"POST",body:JSON.stringify({items:itemsToSend,statuses:statusesToSend})}).then(function(r){return r.json();}).then(function(d){
      if(d.ok)setSyncStatus("ok");else setSyncStatus("error");
