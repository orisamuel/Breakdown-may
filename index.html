<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#060d1a" />
<title>ברייקדאון מאי</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #060d1a; overscroll-behavior: none; min-height: 100vh; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #e2e8f0; }
  input[type=range] { accent-color: #fbbf24; width: 100%; }
  button:active { transform: scale(0.97); }
  textarea, input, button { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 3px; }
  .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; }
  .loader-dot { width: 10px; height: 10px; background: #7c3aed; border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }
  .loader-dot:nth-child(1) { animation-delay: -0.32s; }
  .loader-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
  .loader-text { color: #475569; font-size: 13px; letter-spacing: 2px; }
  .loader-row { display: flex; gap: 8px; }
  .err { background: #1a0505; border: 1px solid #991b1b; color: #fca5a5; padding: 16px; margin: 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-family: monospace; }
</style>
</head>
<body>
<div id="root">
  <div class="loader">
    <div class="loader-row">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
    <div class="loader-text">טוען...</div>
  </div>
</div>
<script>
  window.addEventListener('error', function(e) {
    var el = document.getElementById('root');
    if (el) el.innerHTML = '<div class="err">שגיאה:\n\n' + (e.message || e) + '\n\n' + (e.filename || '') + ':' + (e.lineno || '') + '</div>';
  });
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
